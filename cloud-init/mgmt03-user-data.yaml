#cloud-config
# mgmt03: joins the management cluster started by mgmt01.
# Deploy after mgmt01 is Ready (kubectl get nodes on mgmt01).
# Rancher, Longhorn and monitoring come from mgmt01's manifests, so they are not repeated here.
#
# Before use, replace:
#   <RKE2_CLUSTER_TOKEN>  same value as in mgmt01
package_update: true
package_upgrade: true
packages: [curl, jq, chrony, open-iscsi, nfs-common, cryptsetup, dmsetup]
write_files:
  # Longhorn prerequisites
  - path: /etc/modules-load.d/longhorn.conf
    content: |
      iscsi_tcp
      dm_crypt
  - path: /etc/multipath.conf
    append: true
    content: |
      blacklist {
          devnode "^sd[a-z0-9]+"
      }
  - path: /etc/rancher/rke2/config.yaml
    permissions: '0600'
    content: |
      # CHANGE: join address = DNS name of VIP-MGMT, port 9345
      server: https://rke-mgmt.gpu.lab:9345
      # CHANGE: same token as mgmt01
      token: <RKE2_CLUSTER_TOKEN>
      # CHANGE: this node's IP
      node-ip: 172.16.40.7
      # CHANGE: same tls-san list as mgmt01
      tls-san:
        - rke-mgmt.gpu.lab
        - rancher.gpu.lab
        - 172.16.40.20
        - mgmt01.gpu.lab
        - mgmt02.gpu.lab
        - mgmt03.gpu.lab
      profile: cis
      pod-security-admission-config-file: /etc/rancher/rke2/rancher-psa.yaml
      write-kubeconfig-mode: "0600"
      etcd-snapshot-schedule-cron: "0 */6 * * *"
      etcd-snapshot-retention: 28
  # Same PSA file as mgmt01
  - path: /etc/rancher/rke2/rancher-psa.yaml
    permissions: '0600'
    content: |
      apiVersion: apiserver.config.k8s.io/v1
      kind: AdmissionConfiguration
      plugins:
        - name: PodSecurity
          configuration:
            apiVersion: pod-security.admission.config.k8s.io/v1
            kind: PodSecurityConfiguration
            defaults:
              enforce: "restricted"
              enforce-version: "latest"
              audit: "restricted"
              audit-version: "latest"
              warn: "restricted"
              warn-version: "latest"
            exemptions:
              usernames: []
              runtimeClasses: []
              namespaces: [calico-apiserver, calico-system, tigera-operator,
                cattle-alerting, cattle-capi-system, cattle-csp-adapter-system,
                cattle-elemental-system, cattle-epinio-system, cattle-externalip-system,
                cattle-fleet-local-system, cattle-fleet-system, cattle-gatekeeper-system,
                cattle-global-data, cattle-global-nt, cattle-impersonation-system,
                cattle-istio, cattle-istio-system, cattle-logging, cattle-logging-system,
                cattle-monitoring-system, cattle-neuvector-system, cattle-prometheus,
                cattle-provisioning-capi-system, cattle-resources-system, cattle-scc-system,
                cattle-sriov-system, cattle-system, cattle-turtles-system,
                cattle-ui-plugin-system, cattle-windows-gmsa-system,
                cert-manager, cis-operator-system, compliance-operator-system,
                longhorn-system, rancher-alerting-drivers, rancher-compliance-system,
                security-scan, sr-operator-system, traefik,
                fleet-default, fleet-local, istio-system,
                kube-node-lease, kube-public, kube-system]
  - path: /etc/profile.d/rke2.sh
    content: |
      export PATH=$PATH:/var/lib/rancher/rke2/bin
      export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
runcmd:
  - swapoff -a
  - sed -i '/ swap / s/^/#/' /etc/fstab
  - modprobe iscsi_tcp
  - modprobe dm_crypt
  - systemctl enable --now iscsid chrony
  - systemctl restart multipathd || true
  - id etcd || useradd -r -c "etcd user" -s /sbin/nologin -M etcd -U
  # CHANGE (optional): must be the SAME RKE2 version as mgmt01
  - curl -sfL https://get.rke2.io | INSTALL_RKE2_VERSION=v1.35.10+rke2r1 INSTALL_RKE2_TYPE=server sh -
  - cp -f /usr/local/share/rke2/rke2-cis-sysctl.conf /etc/sysctl.d/60-rke2-cis.conf
  - systemctl restart systemd-sysctl
  - systemctl enable --now rke2-server
